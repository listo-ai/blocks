# MQTT publish node — takes a Msg on `in` and publishes it to the
# configured topic using its parent client's session. Node-RED `mqtt out`
# semantics: if `msg.topic` / `msg.metadata.qos` / `msg.metadata.retain`
# are set on the inbound msg, they override the node's settings, so the
# same pub node can serve many topics driven by upstream logic.
#
# `must_live_under` enforces the client-scope: a pub node placed at the
# flow root (or anywhere other than under a client) is rejected at
# create time with a placement error.

id: com.listo.mqtt-client.pub
display_name: MQTT Publish

facets:
  - isCompute

containment:
  must_live_under:
    - kind: com.listo.mqtt-client.client
  may_contain: []
  cardinality_per_parent: many_per_parent
  cascade: strict

slots:
  - name: in
    role: input
    value_kind: string
    trigger: true

  # `out` carries a stats envelope after each publish attempt:
  # `{ success, topic, qos, retain, bytes, error? }`. Downstream nodes
  # chain on it for logging, retry, or dashboard counters — same shape
  # as Node-RED's "mqtt out with status feedback" pattern.
  - name: out
    role: output
    value_kind: json

  # Running tallies surface on the node card.
  - name: publish_count
    role: status
    value_kind: number
  - name: error_count
    role: status
    value_kind: number
  - name: last_topic
    role: status
    value_kind: string

settings_schema:
  type: object
  properties:
    topic:
      type: string
      title: Topic
      description: >-
        Default MQTT topic to publish to. Left blank if the topic is
        supplied on each message via `msg.topic`.
    qos:
      type: integer
      title: QoS
      default: 0
      enum: [0, 1, 2]
    retain:
      type: boolean
      title: Retained
      default: false

# Node-RED-style per-message overrides. `msg.metadata.<key>` wins over
# persisted settings. `msg.topic` (top-level) is also honoured by the
# behaviour — handled in code because it lives outside `metadata`.
msg_overrides:
  topic: topic
  qos: qos
  retain: retain
