# com.listo.bacnet — device node.
#
# Represents a single remote BACnet device. Must live under a driver.
# Points (read/write) live under the device and inherit its device_id
# and address when issuing requests.

id: com.listo.bacnet.device
display_name: BACnet Device

facets:
  - isCompute
  - isIdentity

containment:
  must_live_under:
    - kind: com.listo.bacnet.driver
  may_contain:
    - kind: com.listo.bacnet.point
  cardinality_per_parent: many_per_parent
  cascade: strict

slots: []

settings_schema:
  type: object
  properties:
    host:
      type: string
      title: Device IP / hostname
      default: "192.168.1.1"
    port:
      type: integer
      title: BACnet/IP port
      default: 47808
      minimum: 1
      maximum: 65535
    device_id:
      type: integer
      title: BACnet device instance
      description: >-
        The numeric BACnet device instance. Used to address requests on
        the network. Must match the remote device's configuration.
      default: 0
      minimum: 0
  required:
    - host
    - port
    - device_id
