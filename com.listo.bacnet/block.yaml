id: com.listo.bacnet
version: 0.1.0
display_name: "BACnet"
description: >-
  BACnet/IP connectivity: a driver manages the local interface; devices are
  remote BACnet nodes; points are individual object properties (read or write).

contributes:
  ui:
    entry: ui/remoteEntry.js
    exposes:
      - name: Panel
        module: "./Panel"
        contributes_to: sidebar

  process_bin:
    path: dist/process

  kinds:
    - kinds/driver.yaml
    - kinds/device.yaml
    - kinds/point.yaml

requires:
  - id: spi.msg
    version: "^1"
