# Plugin crate for `com.acme.hello`. Kept OUTSIDE the main workspace
# because it targets `wasm32-unknown-unknown` — making it a member
# would force workspace-wide target gating.
#
# Build:
#   cargo build --target wasm32-unknown-unknown --release
#   mkdir -p dist
#   cp target/wasm32-unknown-unknown/release/acme_hello.wasm dist/plugin.wasm
#
# The UI side (ui/remoteEntry.js) is built separately — see ui/ and
# the root rsbuild config. One plugin directory, two contributions.
[package]
name = "acme-hello"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
blocks-sdk = { git = "https://github.com/listo-ai/agent-sdk", branch = "main", package = "listo-blocks-sdk", default-features = false, features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Plugins live on the edge — shave the wasm.
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# ---------------------------------------------------------------------------
# Local-dev overrides — ignored by `cargo publish` / downstream consumers.
[patch."https://github.com/listo-ai/agent-sdk"]
listo-blocks-sdk = { path = "../../agent-sdk/blocks-sdk" }
listo-blocks-sdk-macros = { path = "../../agent-sdk/blocks-sdk-macros" }

[patch."https://github.com/listo-ai/contracts"]
listo-spi = { path = "../../contracts/spi" }
